<!doctype html>
<!--
  PROTOTYPE, throw away. Milestone 1 of Dad-a-base, round 3.
  Direction C2 with masthead M1 (blackletter crest) is chosen. Three fonts for content headings (h1, h2),
  switchable via ?variant=H1|H2|H3, on ?page=home|joke|404 in ?theme=light|dark. Everything else is unchanged.
  H1: Playfair Display, a classic headline serif. H2: Oswald, a condensed tabloid sans. H3: Libre Franklin, a broadsheet gothic.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dad-a-base · heading font prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bangers&family=Comic+Neue:ital,wght@0,700;1,700&family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,800;0,900;1,800&family=Oswald:wght@600;700&family=Libre+Franklin:ital,wght@0,800;0,900;1,800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Atkinson Hyperlegible', sans-serif; }
  #root { min-height: 100dvh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); }
  main { flex: 1; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  .wrap { width: 100%; max-width: 64rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  /* ───────────── C2 · Sunday funnies (unchanged, plus --skin and --hair for the illustration) ───────────── */
  .C2 { --paper:#f3eee2; --panel:#fbf8f0; --ink:#2b2b2b; --muted:#5d584e; --red:#c8553d; --blue:#3e6990; --yellow:#e9b44c; --dots:rgba(200,85,61,.16); --skin:#f2c7a5; --hair:#4a3426; }
  .C2[data-theme=dark] { --paper:#1d1f24; --panel:#262931; --ink:#ece6d6; --muted:#b5ad9c; --red:#e8846f; --blue:#86b1d9; --yellow:#f0c56b; --dots:rgba(232,132,111,.14); --skin:#d9a77f; }
  .C2 header { text-align:center; padding:1.5rem 1.25rem 0; max-width:64rem; margin:0 auto; width:100%; }
  .C2 .dateline { display:flex; justify-content:space-between; flex-wrap:wrap; gap:.5rem; border-top:3px double var(--ink); border-bottom:1px solid var(--ink); padding:.35rem 0; margin-top:.75rem;
                  font-family:'Comic Neue', cursive; font-weight:700; font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .C2 nav { display:flex; justify-content:center; gap:.25rem 1.5rem; flex-wrap:wrap; border-bottom:3px double var(--ink); }
  .C2 nav a { text-decoration:none; font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:.9rem; padding:.7rem .25rem; min-height:44px; display:inline-flex; align-items:center; border-bottom:4px solid transparent; }
  .C2 nav a[aria-current] { border-bottom-color:var(--red); color:var(--red); }
  .C2 .cols { display:grid; grid-template-columns: 2fr 1fr; gap:2rem; }
  .C2 .kicker { font-family:'Comic Neue', cursive; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--red); font-size:.85rem; margin:0 0 .5rem; }
  .C2 h1, .C2 h2 { font-family:'Bangers', cursive; font-weight:400; letter-spacing:.04em; margin:0 0 .75rem; line-height:1.05; }
  .C2 h1 { font-size:2.4rem; } .C2 h2 { font-size:1.5rem; }
  .C2 .frame { border:3px solid var(--ink); background:var(--panel) radial-gradient(var(--dots) 1.6px, transparent 1.7px) 0 0 / 8px 8px; padding:2.5rem 2rem; }
  .C2 .frame p { margin:0; font-size:clamp(1.35rem, 3vw, 1.8rem); font-weight:700; line-height:1.4; background:var(--panel); padding:.2rem .4rem; box-decoration-break:clone; -webkit-box-decoration-break:clone; display:inline; }
  .C2 figcaption { font-family:'Comic Neue', cursive; font-style:italic; font-weight:700; color:var(--muted); margin-top:.6rem; }
  .C2 .row { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1.5rem; }
  .C2 .btn { border:2px solid var(--ink); background:var(--panel); color:var(--ink); padding:.55rem 1rem; min-height:44px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:.85rem; box-shadow:3px 3px 0 var(--ink); }
  .C2 .btn.primary { background:var(--red); color:#fff; border-color:var(--ink); }
  .C2[data-theme=dark] .btn.primary { color:#1d1f24; }
  .C2 aside section { border-top:3px solid var(--ink); padding-top:.75rem; margin-bottom:2rem; }
  .C2 aside input { width:100%; border:2px solid var(--ink); background:var(--panel); color:var(--ink); padding:.6rem .8rem; margin-bottom:.6rem; }
  .C2 aside ol { margin:0; padding-left:1.25rem; } .C2 aside li { margin:.6rem 0; line-height:1.4; }
  .C2 .correction { max-width:40rem; margin:1rem auto; border:3px solid var(--ink); background:var(--panel); padding:1.75rem; box-shadow:6px 6px 0 var(--yellow); }
  .C2 .correction h1 { color:var(--red); }
  .C2 footer { border-top:3px double var(--ink); padding:1rem 1.25rem; text-align:center; font-family:'Comic Neue', cursive; font-weight:700; color:var(--muted); }
  @media (max-width: 48rem) { .C2 .cols { grid-template-columns:1fr; } }

  /* ───────────── mastheads ───────────── */
  .masthead { display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink); }
  .masthead .the { display:block; }
  .masthead .hy { color:var(--red); }

  /* M1 · blackletter, with the illustration as the paper's crest between two "ears" */
  .M1 .masthead { gap:1.25rem; }
  .M1 .word { font-family:'UnifrakturMaguntia', serif; font-size:clamp(2.6rem, 9vw, 5.2rem); line-height:1; }
  .M1 .the { font-family:'UnifrakturMaguntia', serif; font-size:.45em; }
  .M1 .crest { width:clamp(4rem, 12vw, 6.5rem); flex:none; }
  .M1 .ears { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem; }
  .M1 .ear { border:2px solid var(--ink); padding:.4rem .6rem; font-family:'Comic Neue', cursive; font-weight:700; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); max-width:10rem; line-height:1.3; }
  .M1 .ear:first-child { justify-self:start; } .M1 .ear:last-child { justify-self:end; }
  @media (max-width: 48rem) { .M1 .ear { display:none; } .M1 .ears { grid-template-columns:1fr; } }

  /* M2 · heavy slab, illustration centred above the name */
  .M2 .masthead { flex-direction:column; gap:.25rem; }
  .M2 .art { width:clamp(5rem, 14vw, 7.5rem); }
  .M2 .word { font-family:'Ultra', serif; font-size:clamp(2.2rem, 8vw, 4.4rem); line-height:1; letter-spacing:.01em; }
  .M2 .the { font-family:'Comic Neue', cursive; font-weight:700; font-size:.3em; text-transform:uppercase; letter-spacing:.3em; color:var(--muted); margin-bottom:.15em; }

  /* M3 · comic caps, the dad peeking over the name as if it's the paper he's reading */
  .M3 .masthead { position:relative; flex-direction:column; padding-top:clamp(2.6rem, 7vw, 3.6rem); }
  .M3 .peek { position:absolute; top:0; left:50%; transform:translateX(-50%); width:clamp(5rem, 13vw, 7rem); }
  .M3 .word { position:relative; font-family:'Luckiest Guy', cursive; font-size:clamp(2.6rem, 9vw, 5rem); line-height:1; letter-spacing:.03em;
              background:var(--panel); border:3px solid var(--ink); padding:.15em .4em 0; box-shadow:6px 6px 0 var(--red); }
  .M3 .hands { position:absolute; top:-.3em; left:0; right:0; display:flex; justify-content:space-between; padding:0 .1em; margin:0 -.25em; pointer-events:none; }
  .M3 .hands i { width:.42em; height:.42em; border-radius:50%; background:var(--skin); border:3px solid var(--ink); }

  /* ───────────── heading fonts ───────────── */
  .H1 h1, .H1 h2 { font-family:'Playfair Display', serif; font-weight:900; letter-spacing:0; line-height:1.1; }
  .H1 h1 { font-size:2.5rem; } .H1 h2 { font-size:1.45rem; font-style:italic; font-weight:800; }
  .H2 h1, .H2 h2 { font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.01em; line-height:1.05; }
  .H2 h1 { font-size:2.7rem; } .H2 h2 { font-size:1.4rem; font-weight:600; letter-spacing:.04em; }
  .H3 h1, .H3 h2 { font-family:'Libre Franklin', sans-serif; font-weight:900; letter-spacing:-.015em; line-height:1.08; }
  .H3 h1 { font-size:2.5rem; } .H3 h2 { font-size:1.35rem; font-weight:800; letter-spacing:0; }

  /* ───────────── prototype switcher (not part of any design) ───────────── */
  #proto { position:fixed; left:50%; bottom:1rem; transform:translateX(-50%); z-index:99; display:flex; gap:.25rem; align-items:center; padding:.35rem;
           background:#111; color:#fff; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.4); font:13px/1 system-ui, sans-serif; max-width:calc(100vw - 1rem); flex-wrap:wrap; justify-content:center; }
  #proto button { background:transparent; color:#fff; border:0; border-radius:999px; padding:.5rem .7rem; }
  #proto button[aria-pressed=true] { background:#fff; color:#111; }
  #proto .label { padding:0 .6rem; font-weight:600; min-width:13rem; text-align:center; }
  #proto .sep { width:1px; height:1.4rem; background:#444; margin:0 .2rem; }
</style>
</head>
<body>
<div id="root"></div>
<div id="proto" role="toolbar" aria-label="Prototype controls"></div>
<script>
const jokes = [
  { id: 'daaUfibh', joke: 'Why was the big cat disqualified from the race? Because it was a cheetah.' },
  { id: 'BI699EY08Ed', joke: 'Bad at golf? Join the club.' },
  { id: 'ORKmyAIYvzd', joke: 'No matter how kind you are, German children are kinder.' },
  { id: 'xXg3LZLZDd', joke: '*Reversing the car* "Ah, this takes me back"' },
]
const VARIANTS = { H1: 'Playfair Display', H2: 'Oswald', H3: 'Libre Franklin' }
const PAGES = { home: 'Home', joke: 'Joke detail', 404: '404' }

const params = new URLSearchParams(location.search)
const state = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'H1',
  page: PAGES[params.get('page')] ? params.get('page') : 'home',
  theme: params.get('theme') === 'dark' ? 'dark' : 'light',
}

// A dad reading the paper: bald crown with a tuft, glasses and raised brows above the fold, hands gripping its edges.
const dadWithPaper = (cls, { paper = true } = {}) => `<svg class="${cls}" viewBox="0 0 140 ${paper ? 120 : 64}" aria-hidden="true">
  <path d="M30 64 q0-50 40-50 q40 0 40 50z" fill="var(--skin)" stroke="var(--ink)" stroke-width="4"/>
  <path d="M30 52 q2-12 10-16 M110 52 q-2-12-10-16" stroke="var(--hair)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M66 15 q-2-10 6-12 q-4 6 2 11" fill="var(--hair)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M46 34 q8-6 16 0 M78 34 q8-6 16 0" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="54" cy="47" r="10" fill="var(--panel)" stroke="var(--ink)" stroke-width="4"/>
  <circle cx="86" cy="47" r="10" fill="var(--panel)" stroke="var(--ink)" stroke-width="4"/>
  <path d="M64 47 h12" stroke="var(--ink)" stroke-width="4"/>
  <circle cx="56" cy="49" r="3" fill="var(--ink)"/><circle cx="88" cy="49" r="3" fill="var(--ink)"/>
  ${paper ? `
  <rect x="8" y="62" width="124" height="54" rx="2" fill="var(--panel)" stroke="var(--ink)" stroke-width="4"/>
  <path d="M70 62 v54" stroke="var(--ink)" stroke-width="2"/>
  <text x="38" y="80" text-anchor="middle" font-family="Bangers" font-size="13" fill="var(--red)">JOKES</text>
  <path d="M18 88 h40 M18 96 h40 M18 104 h30 M80 74 h42 M80 82 h42 M80 90 h42 M80 98 h42 M80 106 h28" stroke="var(--muted)" stroke-width="3"/>
  <circle cx="12" cy="74" r="8" fill="var(--skin)" stroke="var(--ink)" stroke-width="4"/>
  <circle cx="128" cy="74" r="8" fill="var(--skin)" stroke="var(--ink)" stroke-width="4"/>` : ''}
</svg>`

const name = `Dad<span class="hy">-a-</span>base`

const mastheads = {
  M1: () => `
    <div class="ears">
      <span class="ear">Late edition · Partly punny, with a chance of groans</span>
      <a class="masthead" href="#" aria-label="The Dad-a-base, home">${dadWithPaper('crest')}<span class="word"><span class="the">The</span>${name}</span></a>
      <span class="ear">Est. by dads · Price: one groan</span>
    </div>`,
  M2: () => `
    <a class="masthead" href="#" aria-label="The Dad-a-base, home">${dadWithPaper('art')}<span class="word"><span class="the">The</span>${name}</span></a>`,
  M3: () => `
    <a class="masthead" href="#" aria-label="The Dad-a-base, home">${dadWithPaper('peek', { paper: false })}
      <span class="word"><span class="hands" aria-hidden="true"><i></i><i></i></span>${name}</span></a>`,
}

const nav = (p) => {
  const cur = (k) => (p === k ? ' aria-current="page"' : '')
  return `<a href="#"${cur('home')}>Home</a><a href="#">Search</a><a href="#"${cur('random')}>Random</a><a href="#">Favorites</a><a href="#">About</a>`
}
const [j0, ...favs] = jokes

const pages = {
  home: () => `
    <div class="cols">
      <article>
        <p class="kicker">Today's top story</p>
        <h1>Local dad says the thing again</h1>
        <figure style="margin:0"><div class="frame"><p>${j0.joke}</p></div>
          <figcaption>Witnesses report groaning. Joke #${j0.id}.</figcaption></figure>
        <div class="row"><button class="btn primary">Another one</button><button class="btn">Open this joke</button></div>
      </article>
      <aside>
        <section><h2>Search the archives</h2><input placeholder="Cats, golf, dads…" aria-label="Search jokes"><button class="btn">Search</button></section>
        <section><h2>Readers' favorites</h2><ol>${favs.map((j) => `<li>${j.joke}</li>`).join('')}</ol></section>
      </aside>
    </div>`,
  joke: () => `
    <p class="kicker">From the archives · Joke #${j0.id}</p>
    <figure style="margin:0;max-width:44rem"><div class="frame"><p>${j0.joke}</p></div>
      <figcaption>Reprinted with permission of every dad, everywhere.</figcaption></figure>
    <div class="row"><button class="btn primary">Copy</button><button class="btn">Share</button><button class="btn">♥ Favorite</button></div>`,
  404: () => `
    <div class="correction">
      <p class="kicker">Correction</p>
      <h1>This page does not exist</h1>
      <p>An earlier link said there was something here. There isn't: the address may be mistyped, or the joke may never have existed. The Dad-a-base regrets the error.</p>
      <div class="row"><button class="btn primary">Front page</button><button class="btn">Search the archives</button></div>
    </div>`,
}

function render() {
  const root = document.getElementById('root')
  root.className = `C2 M1 ${state.variant}`
  root.dataset.theme = state.theme
  root.innerHTML = `
    <header>${mastheads.M1()}
      <div class="dateline"><span>Vol. 1 · No. 404</span><span>All the jokes that are fit to groan</span><span>Free, like Dad's advice</span></div>
      <nav aria-label="Main">${nav(state.page === 'joke' ? 'random' : state.page)}</nav></header>
    <main><div class="wrap">${pages[state.page]()}</div></main>
    <footer>Jokes syndicated from icanhazdadjoke.com</footer>`

  const keys = Object.keys(VARIANTS)
  const proto = document.getElementById('proto')
  proto.innerHTML = `
    <button data-act="prev" aria-label="Previous heading font">◀</button>
    <span class="label">${state.variant} · ${VARIANTS[state.variant]}</span>
    <button data-act="next" aria-label="Next heading font">▶</button>
    <span class="sep"></span>
    ${Object.entries(PAGES).map(([k, v]) => `<button data-page="${k}" aria-pressed="${state.page === k}">${v}</button>`).join('')}
    <span class="sep"></span>
    <button data-act="theme" aria-pressed="${state.theme === 'dark'}">${state.theme === 'dark' ? '☾ Dark' : '☀ Light'}</button>`
  proto.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return
    const i = keys.indexOf(state.variant)
    if (b.dataset.act === 'prev') state.variant = keys[(i + keys.length - 1) % keys.length]
    if (b.dataset.act === 'next') state.variant = keys[(i + 1) % keys.length]
    if (b.dataset.act === 'theme') state.theme = state.theme === 'dark' ? 'light' : 'dark'
    if (b.dataset.page) state.page = b.dataset.page
    sync()
  }
  document.title = `${state.variant} ${PAGES[state.page]} ${state.theme} · Dad-a-base prototype`
  console.log('prototype state', { ...state })
}

function sync() {
  history.replaceState(null, '', `?variant=${state.variant}&page=${state.page}&theme=${state.theme}`)
  render()
}

addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return
  const keys = Object.keys(VARIANTS), i = keys.indexOf(state.variant)
  if (e.key === 'ArrowLeft') { state.variant = keys[(i + keys.length - 1) % keys.length]; sync() }
  if (e.key === 'ArrowRight') { state.variant = keys[(i + 1) % keys.length]; sync() }
})

sync()
</script>
</body>
</html>
