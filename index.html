<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Dad-a-base: all the jokes that are fit to groan." />
    <title>The Dad-a-base</title>
    <script>
      // The saved theme, applied before first paint so the page doesn't flash. Same key as src/stores/theme.ts.
      try {
        var theme = localStorage.getItem('dadabase:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
